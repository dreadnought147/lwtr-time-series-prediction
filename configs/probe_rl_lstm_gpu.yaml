# TIMING PROBE (GPU) — not a result. One window, one seed, 1/10th the timesteps.
#
# Purpose: measure what a RecurrentPPO (LSTM policy) window costs on this
# machine before committing to a full sweep. RecurrentPPO is substantially
# slower than PPO because it cannot flatten the rollout — it has to replay
# sequences in order to carry hidden state.
#
# Multiply the reported `train Ns` by 10 to estimate a real 100k-step window,
# then by (k values x seeds x 31 windows) for the sweep.
#
# Run:
#   python scripts/train.py --config configs/probe_rl_lstm_gpu.yaml
#
# Identical to probe_rl_lstm.yaml except device: cuda. Compare the reported
# `train Ns` against the CPU probe's 54.51s.
#
# Expect the GPU to LOSE here, and do not be surprised by it. The network is a
# 128-unit LSTM reading a 3-number observation — far too small to use a GPU's
# parallelism. Meanwhile the agent steps the environment one day at a time in
# Python, which no GPU touches, and every one of those tiny steps now pays to
# copy data to the card and back. GPUs win on big batched matrix work; this is
# small sequential work. Stable-Baselines3's own documentation says to expect
# MLP-sized policies to be faster on CPU.
#
# Worth measuring anyway: it costs one minute and settles the question with a
# number from this machine rather than an expectation.
#
# Writes to results/probe_rl_lstm_gpu/ — delete that directory before re-probing,
# or the resume logic will skip the window and report nothing.

seeds: [0]

device: cuda

data:
  vix_file: vix.csv
  sp_file: sp500.csv
  observation_col: vix_close
  asset_col: sp_close

env:
  transaction_cost: 0.0001

policy:
  type: lstm                    # RecurrentPPO + MlpLstmPolicy
  lstm_hidden_size: 128         # copied from the supervised champion (hp_id 2)
  n_lstm_layers: 1              # copied from the supervised champion
  shared_lstm: false            # actor and critic each get their own LSTM
  enable_critic_lstm: true

memory:
  type: fs
  k_grid: [3]

ppo:
  total_timesteps: 10000        # 1/10th of the real budget — probe only
  n_steps: 2048
  batch_size: 64
  learning_rate: 0.0003

walk_forward:
  train_size: 1260
  test_size: 252
  max_windows: 1
