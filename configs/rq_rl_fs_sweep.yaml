# RQ2 sweep — PPO + Frame Stacking, k ∈ {3, 5, 10, 20}, 7 seeds each.
# Run: python scripts/train.py --config configs/rq_rl_fs_sweep.yaml
#
# Matched-budget pair with configs/rq_rl_as_sweep.yaml — identical PPO block,
# identical walk-forward, identical k_grid. Only memory.type differs. That's
# what makes the AS-vs-FS comparison honest at the mechanism level.

seeds: [0, 1, 2, 3, 4, 5, 6]      # 7 seeds — inside the defensible 5-10 band

device: cpu

data:
  vix_file: vix.csv
  sp_file: sp500.csv
  observation_col: vix_close
  asset_col: sp_close

env:
  transaction_cost: 0.0001

memory:
  type: fs                        # Frame Stacking
  k_grid: [3, 5, 10, 20]          # memory budget sweep

ppo:
  # FIXED across the whole sweep — same values as configs/rq_rl_as_sweep.yaml.
  # Isolates the memory mechanism as the only free variable in the FS↔AS
  # comparison. Do NOT change one side without changing the other.
  total_timesteps: 100000
  n_steps: 2048
  batch_size: 64
  learning_rate: 0.0003

walk_forward:
  train_size: 1260                # ~5 trading years
  test_size: 252                  # ~1 trading year
  max_windows: null               # null = use all 31 windows
