<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Benny's Weekly Deck — PPTX Generator</title>
<style>
body {
  font-family: -apple-system, Segoe UI, Roboto, sans-serif;
  max-width: 760px;
  margin: 48px auto;
  padding: 24px;
  background: #0f172a;
  color: #e2e8f0;
}
h1 { margin: 0 0 8px; color: #fbbf24; }
p { line-height: 1.6; }
button {
  padding: 18px 36px;
  font-size: 18px;
  font-weight: 700;
  background: #fbbf24;
  color: #0f172a;
  border: 0;
  border-radius: 10px;
  cursor: pointer;
  margin: 24px 0;
  box-shadow: 0 4px 14px rgba(251, 191, 36, 0.4);
}
button:hover { background: #f59e0b; }
.status {
  padding: 14px 18px;
  margin-top: 12px;
  border-radius: 8px;
  background: #334155;
  display: none;
}
.ok { background: #065f46; color: #d1fae5; }
.err { background: #7f1d1d; color: #fecaca; }
code { background: #1e293b; padding: 2px 6px; border-radius: 3px; color: #fbbf24; }
.hint { color: #94a3b8; font-size: 14px; margin-top: 8px; }
</style>
</head>
<body>

<h1>Benny's Weekly Deck</h1>
<p>Click the button below to generate <code>benny_weekly_update_2026-10-05.pptx</code>.  It downloads to your <strong>Downloads</strong> folder — move it into <code>takeoff/</code> once it lands.</p>
<p class="hint">15-minute presentation. ~16 slides. Brainstorm feel, dark accent, R + bot + chart texture, cited sources where relevant.</p>

<button id="gen">Generate PPTX</button>
<div id="status" class="status"></div>

<script src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>
<script>
document.getElementById('gen').addEventListener('click', async () => {
  const s = document.getElementById('status');
  s.style.display = 'block';
  s.className = 'status';
  s.textContent = 'Building 16 slides...';

  const pptx = new PptxGenJS();
  pptx.layout = 'LAYOUT_WIDE';   // 13.33 x 7.5
  pptx.title = 'Learning to Predict with Financial Time Series — 2026-10-05';
  pptx.author = 'Banele Mkhize';

  // ============================================================
  //  THEME — brainstormy, scientific, warm accent
  // ============================================================
  const C = {
    bg:      'F8FAFC',
    panel:   'FFFFFF',
    ink:     '0F172A',
    dim:     '475569',
    accent:  '2563EB',       // deep blue
    gold:    'D97706',       // medal/champion
    good:    '059669',       // positive
    warn:    'DC2626',
    rand:    '7C3AED',       // violet
    chalk:   'E2E8F0',
  };
  const FONT = 'Calibri';

  // Shared title bar
  const titleBar = (slide, title, sub) => {
    slide.addShape(pptx.shapes.RECTANGLE, {
      x: 0, y: 0, w: 13.33, h: 0.85,
      fill: { color: C.accent }, line: { color: C.accent }
    });
    slide.addText(title, {
      x: 0.4, y: 0.1, w: 10, h: 0.65,
      fontSize: 26, bold: true, color: 'FFFFFF', fontFace: FONT
    });
    if (sub) {
      slide.addText(sub, {
        x: 0.4, y: 0.5, w: 12.5, h: 0.3,
        fontSize: 13, color: 'DBEAFE', fontFace: FONT
      });
    }
  };

  // Decorator — subtle brainstorm texture in corners
  const decor = (slide) => {
    const symbols = ['R', '$', '🤖', '📈', '📊', '💹'];
    const spots = [
      { x: 12.4, y: 0.95, size: 20, opacity: 0.1 },
      { x: 12.6, y: 1.5,  size: 16, opacity: 0.12 },
      { x: 0.3,  y: 6.8,  size: 18, opacity: 0.1 },
      { x: 0.9,  y: 7.1,  size: 14, opacity: 0.1 },
      { x: 12.7, y: 7.0,  size: 15, opacity: 0.1 },
    ];
    spots.forEach((p, i) => {
      slide.addText(symbols[i % symbols.length], {
        x: p.x, y: p.y, w: 0.6, h: 0.5,
        fontSize: p.size, color: C.chalk, bold: true, fontFace: FONT
      });
    });
  };

  // ============================================================
  //  SLIDE 1 — Title + weatherman-with-$R-charts stylised scene
  // ============================================================
  let s1 = pptx.addSlide();
  s1.background = { color: C.bg };

  // Real composited hero image — presenter in a LIVE inset beside a
  // financial forecast board (rand/dollar signs, trend line, trading bots).
  // Built by takeoff/make_title_image.py from public-domain / CC0 Wikimedia assets.
  s1.addImage({
    path: 'assets/title_financial_forecast.png',
    x: 0.85, y: 0.3, w: 11.63, h: 5.52,
  });

  // Title block below the hero image
  s1.addText('Learning to Predict with Financial Time Series', {
    x: 0.5, y: 5.95, w: 12.33, h: 0.6,
    fontSize: 32, bold: true, color: C.ink, fontFace: FONT, align: 'center'
  });
  s1.addText('A brief overview of what I have done — three memory mechanisms, one dataset, two research questions.', {
    x: 0.5, y: 6.55, w: 12.33, h: 0.4,
    fontSize: 15, color: C.dim, fontFace: FONT, align: 'center'
  });
  s1.addText('Banele Mkhize   ·   Supervisor: Geraud Nangue Tasse   ·   2026-10-08', {
    x: 0.5, y: 6.98, w: 12.33, h: 0.35,
    fontSize: 12, color: C.accent, fontFace: FONT, align: 'center'
  });

  // ============================================================
  //  SLIDE 2 — What we've done (appendix)
  // ============================================================
  let s2 = pptx.addSlide();
  s2.background = { color: C.bg };
  titleBar(s2, 'What we have done — appendix', 'Three trained paradigms, one metrics catalogue, next-week commitments.');
  decor(s2);
  const pillars = [
    { k: '1', title: 'LSTM supervised baseline', sub: 'RQ1 control — "can RL beat a tuned LSTM?"' },
    { k: '2', title: 'Frame Stacking RL',       sub: 'Fixed FIFO memory wrapper around PPO.' },
    { k: '3', title: 'Adaptive Stacking RL',    sub: 'Learned memory wrapper — primary contribution.' },
    { k: '4', title: 'Metrics catalogue',       sub: 'Sharpe, cumulative return, max drawdown, position stats, retention.' },
    { k: '5', title: 'Next week — planned',     sub: 'Overleaf IEEE project + poster for Innovation Day.' },
  ];
  pillars.forEach((p, i) => {
    const y = 1.2 + i * 1.1;
    s2.addShape(pptx.shapes.ROUNDED_RECTANGLE, {
      x: 0.6, y: y, w: 1.0, h: 1.0, rectRadius: 0.1,
      fill: { color: C.accent }, line: { color: C.accent }
    });
    s2.addText(p.k, {
      x: 0.6, y: y, w: 1.0, h: 1.0,
      fontSize: 36, bold: true, color: 'FFFFFF', align: 'center', valign: 'middle', fontFace: FONT
    });
    s2.addShape(pptx.shapes.ROUNDED_RECTANGLE, {
      x: 1.8, y: y, w: 11, h: 1.0, rectRadius: 0.1,
      fill: { color: C.panel }, line: { color: 'E2E8F0', width: 1 }
    });
    s2.addText(p.title, {
      x: 2.0, y: y + 0.05, w: 10.6, h: 0.5,
      fontSize: 20, bold: true, color: C.ink, fontFace: FONT
    });
    s2.addText(p.sub, {
      x: 2.0, y: y + 0.5, w: 10.6, h: 0.45,
      fontSize: 14, color: C.dim, fontFace: FONT, italic: true
    });
  });

  // ============================================================
  //  SLIDE 3 — RQ1 quote + why we needed a control
  // ============================================================
  let s3 = pptx.addSlide();
  s3.background = { color: C.bg };
  titleBar(s3, 'Why did we need an RQ1 control?');
  decor(s3);
  // Big quote block
  s3.addShape(pptx.shapes.ROUNDED_RECTANGLE, {
    x: 0.6, y: 1.2, w: 12.1, h: 2.2, rectRadius: 0.15,
    fill: { color: C.panel }, line: { color: C.accent, width: 3 }
  });
  s3.addText('"', {
    x: 0.7, y: 1.1, w: 0.8, h: 0.8,
    fontSize: 72, bold: true, color: C.accent, fontFace: FONT
  });
  s3.addText('RQ1 — paradigm: on this task, can PPO + Frame Stacking match or beat a strong, tuned LSTM supervised baseline (with a threshold trading rule)?', {
    x: 1.5, y: 1.5, w: 11.0, h: 1.5,
    fontSize: 20, italic: true, color: C.ink, fontFace: FONT
  });
  s3.addText('— quoted from the project proposal (locked 2026-06-24)', {
    x: 1.5, y: 3.0, w: 11.0, h: 0.3,
    fontSize: 12, color: C.dim, fontFace: FONT
  });
  // Why we built it
  s3.addText('WHY WE BUILT IT', {
    x: 0.6, y: 3.8, w: 12.0, h: 0.4,
    fontSize: 16, bold: true, color: C.accent, fontFace: FONT
  });
  const whyBullets = [
    'We needed a strong control to compare the RL agents against.',
    'LSTM is the standard sequential supervised predictor in financial RL literature.',
    'If PPO cannot beat a well-tuned LSTM, the RL framing earns nothing — the extra machinery of sequential-decision learning only matters if it beats a simple one-shot forecaster.',
    'A weak LSTM would be dishonest: "PPO beat a lazy LSTM" is not an answer to RQ1.',
  ];
  whyBullets.forEach((t, i) => {
    s3.addText('•  ' + t, {
      x: 0.8, y: 4.3 + i * 0.6, w: 12, h: 0.5,
      fontSize: 14, color: C.ink, fontFace: FONT
    });
  });

  // ============================================================
  //  SLIDE 4 — LSTM: the data
  // ============================================================
  let s4 = pptx.addSlide();
  s4.background = { color: C.bg };
  titleBar(s4, 'LSTM — the data');
  decor(s4);
  s4.addText('THE DATA IN', {
    x: 0.5, y: 1.1, w: 12, h: 0.4,
    fontSize: 18, bold: true, color: C.accent, fontFace: FONT
  });
  const dataPts = [
    'Downloaded time-series data from Yahoo Finance covering ~36 years of daily history.',
    'Inner-joined two series on shared trading days (never left-join / outer — any mismatch would silently inject NaN rewards and corrupt training).',
    'Why we need two series — one as the observation stream (gives the memory signal / regime awareness), the other as the asset we position on and earn reward from. Keeping them separate makes the "memory mechanism contribution" cleanly measurable.',
    'The two chosen series are *negatively correlated across the whole span* (rolling 252-day correlation ≈ −0.7 to −0.8) — exactly the structure a memory-based learner should be able to exploit.',
    'After alignment: 9,188 usable trading days ≈ 24 years of overlap.',
    'Transformed raw prices → log-returns. Log-returns are symmetric around zero, additive over time, approximately stationary in mean, and the ML-friendly standard across financial-RL literature (Moody & Saffell 2001; Hambly, Xu & Yang 2023).',
    'Walk-forward evaluation: 31 non-overlapping windows (5-year train, 1-year test). Fresh model per window, standardisation stats fit on TRAIN slice only (never peek at test).',
  ];
  dataPts.forEach((t, i) => {
    s4.addText('•  ' + t, {
      x: 0.7, y: 1.6 + i * 0.75, w: 12.0, h: 0.7,
      fontSize: 13, color: C.ink, fontFace: FONT
    });
  });

  // ============================================================
  //  SLIDE 5 — LSTM: the model
  // ============================================================
  let s5 = pptx.addSlide();
  s5.background = { color: C.bg };
  titleBar(s5, 'LSTM — the model & how it decides');
  decor(s5);
  s5.addText('ARCHITECTURE', {
    x: 0.5, y: 1.0, w: 6, h: 0.4,
    fontSize: 16, bold: true, color: C.accent, fontFace: FONT
  });
  const arch = [
    'PyTorch nn.LSTM — 2 layers, hidden size swept over {64, 128}.',
    'dropout = 0.2  (standard compromise — Chowdhury 2023).',
    'gradient clipping L2-norm = 5.0 (literature standard for recurrent nets).',
    'weight decay = 1e-5  via Adam (mild regularisation).',
    '15 epochs per walk-forward window.',
    'Sequence length (lookback) = 20 trading days (~1 month).',
    'HP defaults informed by 2026 LSTM-for-finance literature: ES-LSTM (Springer 2025), LSTM hyperparameter guides for financial time-series.',
  ];
  arch.forEach((t, i) => {
    s5.addText('•  ' + t, {
      x: 0.7, y: 1.5 + i * 0.5, w: 5.8, h: 0.5,
      fontSize: 12, color: C.ink, fontFace: FONT
    });
  });
  s5.addText('HOW IT DECIDES', {
    x: 6.9, y: 1.0, w: 6, h: 0.4,
    fontSize: 16, bold: true, color: C.accent, fontFace: FONT
  });
  const decide = [
    'Each day the LSTM sees the last 20 days of VIX log-returns (its "lookback window").',
    'Inputs are z-scored using TRAIN-slice mean & std only — never test. This blocks future-information leakage.',
    'LSTM outputs a scalar guess of tomorrow\'s S&P log-return.',
    'Threshold rule: forecast > 0 → go long (+1). forecast < 0 → short (−1). forecast = 0 → flat (0).',
    'Position earns reward via same formula as the RL agents: reward = position × next-day S&P log-return − cost × |Δposition|.',
    'Fresh model per window — the LSTM for window N is trained from scratch on days before its test slice. No weight carry-over.',
  ];
  decide.forEach((t, i) => {
    s5.addText('•  ' + t, {
      x: 7.1, y: 1.5 + i * 0.68, w: 6.0, h: 0.68,
      fontSize: 12, color: C.ink, fontFace: FONT
    });
  });

  // ============================================================
  //  SLIDE 6 — LSTM: HP sweep + plot
  // ============================================================
  let s6 = pptx.addSlide();
  s6.background = { color: C.bg };
  titleBar(s6, 'LSTM — hyperparameter sweep & fairness');
  decor(s6);
  s6.addText('THE SWEEP', {
    x: 0.5, y: 1.0, w: 7, h: 0.4,
    fontSize: 16, bold: true, color: C.accent, fontFace: FONT
  });
  const sweep = [
    '4 HP combos: hidden ∈ {64, 128} × num_layers ∈ {1, 2}.',
    '7 random seeds per HP combo.',
    '31 walk-forward windows per (HP, seed).',
    '→  4 × 7 × 31 = 868 fresh LSTMs trained from scratch.',
    '',
    'FAIRNESS BOLT-ONS',
    '• Gradient clipping (stops exploding gradients on noisy data).',
    '• Weight decay (mild regularisation).',
    '• Multi-seed with spread reporting — 7 seeds is inside the defensible 5-10 band for ML/RL research (Henderson et al. 2018, "How Many Random Seeds?").',
    '• Per-window train-slice z-scoring (zero information leaks from test).',
    '• HP champion selected by MEAN Sharpe across seeds — not cherry-picked.',
  ];
  sweep.forEach((t, i) => {
    const bold = (t === 'FAIRNESS BOLT-ONS');
    s6.addText(t, {
      x: 0.7, y: 1.4 + i * 0.42, w: 6.5, h: 0.4,
      fontSize: bold ? 15 : 12, bold: bold, color: bold ? C.accent : C.ink, fontFace: FONT
    });
  });
  // Plot — reference by path (same filesystem as HTML; browsers allow file:// same-origin image fetch)
  try {
    s6.addImage({
      path: '../plots/rq1/01_lstm_champion_bar.png',
      x: 7.3, y: 1.2, w: 5.8, h: 3.3,
    });
  } catch (e) { /* image optional */ }
  s6.addText('(if the chart above does not embed: open plots/rq1/01_lstm_champion_bar.png and paste manually in PowerPoint)', {
    x: 7.3, y: 4.6, w: 5.8, h: 0.3,
    fontSize: 9, italic: true, color: C.dim, fontFace: FONT
  });

  // ============================================================
  //  SLIDE 7 — LSTM Champion 🏅
  // ============================================================
  let s7 = pptx.addSlide();
  s7.background = { color: C.bg };
  titleBar(s7, 'LSTM champion');
  decor(s7);
  s7.addText('🏅', {
    x: 1.0, y: 1.6, w: 2.5, h: 2.5,
    fontSize: 180, color: C.gold, align: 'center', fontFace: FONT
  });
  s7.addShape(pptx.shapes.ROUNDED_RECTANGLE, {
    x: 4.2, y: 1.6, w: 8.5, h: 4.8, rectRadius: 0.2,
    fill: { color: C.panel }, line: { color: C.gold, width: 4 }
  });
  s7.addText('Champion LSTM', {
    x: 4.4, y: 1.8, w: 8, h: 0.6,
    fontSize: 28, bold: true, color: C.gold, fontFace: FONT
  });
  s7.addText('hidden size: 128    layers: 1    dropout: 0.2    seq_len: 20', {
    x: 4.4, y: 2.6, w: 8, h: 0.5,
    fontSize: 16, color: C.ink, fontFace: FONT
  });
  s7.addText('Mean Sharpe: +0.208 ± 1.249', {
    x: 4.4, y: 3.4, w: 8, h: 0.6,
    fontSize: 24, bold: true, color: C.good, fontFace: FONT
  });
  s7.addText('across 7 seeds × 31 walk-forward windows (217 test slices total).', {
    x: 4.4, y: 4.1, w: 8, h: 0.4,
    fontSize: 13, color: C.dim, italic: true, fontFace: FONT
  });
  s7.addText('Mean cumulative return: +1.75%        Mean max drawdown: 16.8%', {
    x: 4.4, y: 4.7, w: 8, h: 0.4,
    fontSize: 14, color: C.ink, fontFace: FONT
  });
  s7.addText('This is the number PPO + Frame Stacking has to beat for RQ1.', {
    x: 4.4, y: 5.5, w: 8, h: 0.6,
    fontSize: 15, italic: true, color: C.accent, fontFace: FONT
  });

  // ============================================================
  //  SLIDE 8 — FS: Why + proposal link
  // ============================================================
  let s8 = pptx.addSlide();
  s8.background = { color: C.bg };
  titleBar(s8, 'Frame Stacking (FS) — the simplest RL memory');
  decor(s8);
  s8.addText('WHY WE BUILT IT', {
    x: 0.5, y: 1.1, w: 12, h: 0.4,
    fontSize: 16, bold: true, color: C.accent, fontFace: FONT
  });
  const fsWhy = [
    'FS is the simplest possible memory mechanism for an RL agent — show it the last k observations stacked together. No learning about what to keep.',
    'It is the baseline Adaptive Stacking will be compared against in RQ2. If AS cannot beat FS at matched k, the "learned memory" claim fails.',
    'FS also plays the RL side of RQ1 — the champion FS is what competes against the champion LSTM.',
    'Rooted in deep-RL tradition — same mechanism DQN used at Atari scale (Mnih et al. 2015, Nature).',
  ];
  fsWhy.forEach((t, i) => {
    s8.addText('•  ' + t, {
      x: 0.7, y: 1.6 + i * 0.75, w: 12.0, h: 0.7,
      fontSize: 14, color: C.ink, fontFace: FONT
    });
  });
  s8.addText('HOW IT PLUGS IN', {
    x: 0.5, y: 5.0, w: 12, h: 0.4,
    fontSize: 16, bold: true, color: C.accent, fontFace: FONT
  });
  const fsHow = [
    'A thin wrapper around the Gymnasium env. Keeps a FIFO buffer of the last k observations.',
    'The agent (PPO + plain MLP) has no internal memory — all memory comes from the FS wrapper.',
    'Observation grows from shape (1,) to shape (k,). Nothing else changes.',
  ];
  fsHow.forEach((t, i) => {
    s8.addText('•  ' + t, {
      x: 0.7, y: 5.5 + i * 0.55, w: 12.0, h: 0.5,
      fontSize: 13, color: C.ink, fontFace: FONT
    });
  });

  // ============================================================
  //  SLIDE 9 — FS: model + how it acts + sweep
  // ============================================================
  let s9 = pptx.addSlide();
  s9.background = { color: C.bg };
  titleBar(s9, 'Frame Stacking — the model, action, reward, sweep');
  decor(s9);
  s9.addText('HOW IT ACTS EACH DAY', {
    x: 0.5, y: 1.0, w: 6, h: 0.4,
    fontSize: 16, bold: true, color: C.accent, fontFace: FONT
  });
  const fsAct = [
    'Each day the agent sees k stacked VIX log-returns.',
    'Picks ONE of {short, flat, long} for next-day S&P position.',
    'Reward = position × next-day S&P log-return − cost × |position change|.',
    'Same reward formula as every other config (LSTM, AS, B&H) — enables apples-to-apples comparison.',
    'Transaction cost = 1 basis point per unit flip.',
  ];
  fsAct.forEach((t, i) => {
    s9.addText('•  ' + t, {
      x: 0.7, y: 1.5 + i * 0.55, w: 5.8, h: 0.55,
      fontSize: 12, color: C.ink, fontFace: FONT
    });
  });
  s9.addText('THE SWEEP', {
    x: 7.0, y: 1.0, w: 6, h: 0.4,
    fontSize: 16, bold: true, color: C.accent, fontFace: FONT
  });
  const fsSweep = [
    'k ∈ {3, 5, 10, 20} — memory budget swept.',
    '7 random seeds per k.',
    '31 walk-forward windows per (k, seed).',
    '→  4 × 7 × 31 = 868 fresh PPO agents.',
    '',
    'PPO base config locked identical to AS — only k and the memory wrapper differ.',
    'This is what makes AS vs FS a fair fight.',
    'Training: 100,000 timesteps per walk-forward window.',
  ];
  fsSweep.forEach((t, i) => {
    s9.addText(t, {
      x: 7.2, y: 1.5 + i * 0.5, w: 6, h: 0.5,
      fontSize: 12, color: C.ink, fontFace: FONT
    });
  });
  try {
    s9.addImage({
      path: '../plots/rq1/02_fs_champion_bar.png',
      x: 2.0, y: 4.6, w: 9.3, h: 2.6,
    });
  } catch (e) { /* optional */ }

  // ============================================================
  //  SLIDE 10 — FS Champion 🏅
  // ============================================================
  let s10 = pptx.addSlide();
  s10.background = { color: C.bg };
  titleBar(s10, 'Frame Stacking champion');
  decor(s10);
  s10.addText('🏅', {
    x: 1.0, y: 1.6, w: 2.5, h: 2.5,
    fontSize: 180, color: C.gold, align: 'center', fontFace: FONT
  });
  s10.addShape(pptx.shapes.ROUNDED_RECTANGLE, {
    x: 4.2, y: 1.6, w: 8.5, h: 4.8, rectRadius: 0.2,
    fill: { color: C.panel }, line: { color: C.gold, width: 4 }
  });
  s10.addText('Champion FS', {
    x: 4.4, y: 1.8, w: 8, h: 0.6,
    fontSize: 28, bold: true, color: C.gold, fontFace: FONT
  });
  s10.addText('memory budget k = 3', {
    x: 4.4, y: 2.6, w: 8, h: 0.5,
    fontSize: 18, color: C.ink, fontFace: FONT
  });
  s10.addText('Mean Sharpe: +0.484 ± 1.194', {
    x: 4.4, y: 3.4, w: 8, h: 0.6,
    fontSize: 24, bold: true, color: C.good, fontFace: FONT
  });
  s10.addText('across 7 seeds × 31 walk-forward windows.', {
    x: 4.4, y: 4.1, w: 8, h: 0.4,
    fontSize: 13, color: C.dim, italic: true, fontFace: FONT
  });
  s10.addText('Mean cumulative return: +4.65%        Mean max drawdown: 15.1%', {
    x: 4.4, y: 4.7, w: 8, h: 0.4,
    fontSize: 14, color: C.ink, fontFace: FONT
  });
  s10.addText('RQ1 answered: PPO + FS beats LSTM by ~0.28 Sharpe. RL framing earns its keep.', {
